[project]
name = "cashdesk-review"
version = "0.1.0"
description = "Local video review service for visible signs of cash-discipline violations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "av>=13.0",
    "pillow>=10.4",
    "httpx>=0.27",
    "pydantic>=2.8",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "numpy>=2.4.6",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
